version: 0.2
phases:
  pre_build:
    commands:
            - echo Logging in to Docker Hub...
            - echo $DOCKERHUB_PASSWORD | docker login -u $DOCKERHUB_USERNAME --password-stdin
  build:
    commands:
            - echo Building Docker image...
            - docker build -t sudha15/brain-tasks-app:latest .
            - docker push sudha15/brain-tasks-app:latest
  post_build:
    commands:
            - echo Build completed
artifacts:
  files:
        - deployment.yaml
        - service.yaml